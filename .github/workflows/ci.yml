name: ci
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Patch mkdocs-with-pdf for headless Chrome
        run: python patch_pdf_plugin.py
      - name: Install mermaid-cli for PDF pre-rendering
        run: |
          npm install -g @mermaid-js/mermaid-cli
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Disable debug_html in CI (avoids 6MB print to stdout)
        run: |
          sed -i 's/debug_html: true/debug_html: false/' mkdocs.yml
      - run: PRERENDER_MERMAID=1 mkdocs gh-deploy --force